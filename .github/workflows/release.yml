name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Run Tests
        run: bun run test

      - name: Build BlockFont Engine
        run: bun run build

      - name: Generate Preset Fonts Hierarchy
        run: bun run src/build-release-fonts.ts

      - name: Archive Fonts Package
        run: zip -r blockfont-fonts.zip release-fonts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: blockfont-fonts.zip
          generate_release_notes: true
