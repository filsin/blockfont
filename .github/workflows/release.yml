name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm test

      - name: Build BlockFont Engine
        run: npm run build

      - name: Generate Preset Fonts Hierarchy
        run: npm run build:release-fonts
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Archive Fonts Package
        run: zip -r blockfont-fonts.zip release-fonts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: blockfont-fonts.zip
          generate_release_notes: true
